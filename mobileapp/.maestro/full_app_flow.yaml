appId: com.qlairoslabs.patterndays
---
# Screen 1: Login/Home screen
- action: wait
  duration: 2000

# Tap Sign In to enter app
- tapOn:
    text: "Sign In"

# Wait for navigation to Today screen
- action: wait
  duration: 1500

# Screen 2: Today Check-In Screen
- action: screenshot
  name: "today_screen"

# Scroll down to see more of the Today screen
- action: scroll
  direction: down
  duration: 1000

# Change mood slider
- swipeElement:
    direction: right
    optional: true

# Scroll down more
- action: scroll
  direction: down
  duration: 1000

# Tap notes field and type something
- tapOn:
    id: "*notes*"
    optional: true
- typeText: "Great day!"

# Scroll down to Save button
- action: scroll
  direction: down
  duration: 500

# Tap Save Check-In button
- tapOn:
    text: "Save Check-In"
    optional: true

# Wait for feedback
- action: wait
  duration: 1000

# Navigate to Habits screen
- tapOn:
    text: "Habits"

# Screen 3: Habits Screen
- action: screenshot
  name: "habits_screen"

- action: wait
  duration: 500

# Navigate to History screen
- tapOn:
    text: "History"

# Screen 4: History Screen
- action: screenshot
  name: "history_screen"

- action: wait
  duration: 500

# Scroll through history
- action: scroll
  direction: down
  duration: 1000

# Navigate to Settings screen
- tapOn:
    text: "Settings"

# Screen 5: Settings Screen
- action: screenshot
  name: "settings_screen"

- action: wait
  duration: 500

# Scroll down to see more settings
- action: scroll
  direction: down
  duration: 1000

# Navigate back to Today
- tapOn:
    text: "Today"

# Final screenshot
- action: screenshot
  name: "final_today_screen"

- action: wait
  duration: 500
